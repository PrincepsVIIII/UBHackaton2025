<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Buffalo to the rescue</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Inter", "Segoe UI", Roboto, Arial, sans-serif;
      min-height: 100vh;
      background: #f3f4f6;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Background geometric shapes */
    .bg-shape {
      position: absolute;
      width: 400px;
      height: 400px;
      background: #2563eb;
      clip-path: polygon(0 0, 100% 0, 80% 100%, 0% 100%);
      opacity: 0.15;
      top: -100px;
      left: -100px;
      transform: rotate(20deg);
    }

    .bg-shape2 {
      position: absolute;
      width: 500px;
      height: 500px;
      background: #1d4ed8;
      clip-path: polygon(20% 0%, 100% 0%, 100% 80%, 0 100%);
      opacity: 0.1;
      bottom: -150px;
      right: -150px;
      transform: rotate(-15deg);
    }

    .container {
      position: relative;
      background: #ffffff;
      border-radius: 20px;
      padding: 3rem 2.5rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      text-align: center;
      z-index: 1;
    }

    h2 {
      font-size: 1.9rem;
      font-weight: 700;
      color: #111827;
      margin-bottom: 1rem;
    }

    p {
      color: #6b7280;
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
    }

    a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 500;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    input {
      padding: 0.85rem 1rem;
      border-radius: 12px;
      border: 1px solid #d1d5db;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    input:focus {
      border-color: #2563eb;
    }

    button {
      padding: 0.85rem;
      border-radius: 12px;
      border: none;
      background-color: #2563eb;
      color: #ffffff;
      font-weight: 500;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.25s ease, transform 0.1s ease;
    }

    button:hover {
      background-color: #1d4ed8;
    }

    button:active {
      transform: scale(0.98);
    }

    #status {
      color: #4b5563;
      font-size: 0.95rem;
      margin-top: 1rem;
      min-height: 1.2rem;
    }

    #codeSection {
      display: none;
      flex-direction: column;
      gap: 1rem;
    }

    footer {
      position: absolute;
      bottom: 15px;
      color: #9ca3af;
      font-size: 0.85rem;
      text-align: center;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="bg-shape"></div>
  <div class="bg-shape2"></div>

  <div class="container">
    <h2>Secure Sign-In</h2>
    <p>New user? <a href="/signup.html">Sign up here</a></p>

    <form id="loginForm">
      <input type="email" id="email" placeholder="Email (.edu required)" required />
      <button type="submit" id="requestBtn">Request Code</button>
    </form>

    <div id="codeSection">
      <input type="text" id="code" placeholder="Enter 6-digit code" maxlength="6" pattern="\d{6}" required />
      <button type="button" id="verifyBtn">Verify Code</button>
    </div>

    <div id="status">Not signed in</div>
  </div>

  <footer>
    © 2025 UB Hackaton, All Rights Reserved.
  </footer>

  <script>
    const form = document.getElementById('loginForm');
    const codeSection = document.getElementById('codeSection');
    const status = document.getElementById('status');
    const API_BASE = 'http://localhost:8000';
    let userEmail = '';

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      userEmail = email;

      status.textContent = 'Requesting code...';
      status.style.color = '#4b5563';

      try {
        const res = await fetch(`${API_BASE}/auth/request-code`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, role: 'volunteer' })
        });

        if (res.ok) {
          status.textContent = 'Code sent! Check backend console for OTP.';
          status.style.color = '#16a34a';
          form.style.display = 'none';
          codeSection.style.display = 'flex';
        } else {
          const errorData = await res.json();
          status.textContent = errorData.detail || 'Failed to send code';
          status.style.color = '#dc2626';
        }
      } catch (err) {
        console.error(err);
        status.textContent = 'Network error. Check console.';
        status.style.color = '#dc2626';
      }
    });

    document.getElementById('verifyBtn').addEventListener('click', async () => {
      const code = document.getElementById('code').value;

      if (code.length !== 6) {
        status.textContent = 'Code must be 6 digits';
        status.style.color = '#dc2626';
        return;
      }

      status.textContent = 'Verifying...';
      status.style.color = '#4b5563';

      const res = await fetch(`${API_BASE}/auth/verify-code`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: userEmail, code })
      });

      const data = await res.json();
      if (res.ok) {
        localStorage.setItem('token', data.access_token);
        localStorage.setItem('user', JSON.stringify(data.user));
        status.textContent = `Signed in as: ${data.user.email}`;
        status.style.color = '#16a34a';

        setTimeout(() => {
          if (data.user.role === 'volunteer') {
            window.location.replace('/volunteer-view.html');
          } else if (data.user.role === 'elder') {
            window.location.replace('/submit-report.html');
          } else {
            window.location.replace('/guest-view.html');
          }
        }, 1000);
      } else {
        status.textContent = data.detail || 'Verification failed';
        status.style.color = '#dc2626';
      }
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
      background: linear-gradient(145deg, #e5e7eb, #f9fafb);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      color: #111827;
    }

    .container {
      background-color: #ffffff;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 380px;
      text-align: center;
    }

    h2 {
      font-size: 1.6rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      color: #1e293b;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    input {
      padding: 0.75rem;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 1rem;
    }

    button {
      width: 100%;
      padding: 0.85rem;
      border: none;
      border-radius: 8px;
      background-color: #2563eb;
      color: #ffffff;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.25s ease, transform 0.1s ease;
    }

    button:hover { background-color: #1d4ed8; }
    button:active { transform: scale(0.98); }

    #status {
      color: #4b5563;
      font-size: 0.95rem;
      margin-top: 1rem;
    }

    footer {
      position: absolute;
      bottom: 15px;
      color: #6b7280;
      font-size: 0.85rem;
      text-align: center;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Secure Sign-In</h2>
    <p style="color: #6b7280; font-size: 0.9rem; margin-bottom: 1rem;">New user? <a href="/signup.html" style="color: #2563eb;">Sign up here</a></p>
    <form id="loginForm">
      <input type="email" id="email" placeholder="Email (.edu required)" required />
      <button type="submit" id="requestBtn">Request Code</button>
    </form>
    <div id="codeSection" style="display: none;">
      <input type="text" id="code" placeholder="Enter 6-digit code" maxlength="6" pattern="\d{6}" required />
      <button type="button" id="verifyBtn">Verify Code</button>
    </div>
    <div id="status">Not signed in</div>
  </div>

  <footer>
    © 2025 UB Hackaton, All Rights Reserved.
  </footer>

  <script>
    const form = document.getElementById('loginForm');
    const codeSection = document.getElementById('codeSection');
    const status = document.getElementById('status');
    const API_BASE = 'http://localhost:8000';
    let userEmail = '';

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      userEmail = email;

      status.textContent = 'Requesting code...';
      status.style.color = '#4b5563';

      try {
        // Try volunteer role first (most common for login)
        console.log(`Requesting code for ${email}...`);
        const res = await fetch(`${API_BASE}/auth/request-code`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, role: 'volunteer' })
        });

        console.log(`Response status: ${res.status}`);
        
        if (res.ok) {
          status.textContent = 'Code sent! Check backend console for OTP.';
          status.style.color = '#16a34a';
          form.style.display = 'none';
          codeSection.style.display = 'flex';
          codeSection.style.flexDirection = 'column';
          codeSection.style.gap = '1rem';
        } else {
          const errorData = await res.json();
          console.error('Error:', errorData);
          status.textContent = errorData.detail || 'Failed to send code';
          status.style.color = '#dc2626';
        }
      } catch (err) {
        console.error('Network error:', err);
        status.textContent = 'Network error. Check console for details.';
        status.style.color = '#dc2626';
      }
    });

    document.getElementById('verifyBtn').addEventListener('click', async () => {
      const code = document.getElementById('code').value;

      if (code.length !== 6) {
        status.textContent = 'Code must be 6 digits';
        status.style.color = '#dc2626';
        return;
      }

      status.textContent = 'Verifying...';
      status.style.color = '#4b5563';

      const res = await fetch(`${API_BASE}/auth/verify-code`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: userEmail, code })
      });

      const data = await res.json();
      if (res.ok) {
        localStorage.setItem('token', data.access_token);
        localStorage.setItem('user', JSON.stringify(data.user));
        status.textContent = `Signed in as: ${data.user.email}`;
        status.style.color = '#16a34a';
        
        // Redirect based on role
        setTimeout(() => {
          if (data.user.role === 'volunteer') {
            window.location.replace('/volunteer-view.html');
          } else if (data.user.role === 'elder') {
            window.location.replace('/submit-report.html');
          } else {
            window.location.replace('/guest-view.html');
          }
        }, 1000);
      } else {
        status.textContent = data.detail || 'Verification failed';
        status.style.color = '#dc2626';
      }
    });
  </script>
</body>
</html>

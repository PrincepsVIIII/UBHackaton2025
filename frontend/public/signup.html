<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<title>Buffalo to the rescue</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<style>
		* { box-sizing: border-box; }

		body {
			font-family: "Segoe UI", Roboto, Arial, sans-serif;
			background: linear-gradient(145deg, #e5e7eb, #f9fafb);
			display: flex;
			justify-content: center;
			align-items: center;
			min-height: 100vh;
			margin: 0;
			color: #111827;
		}

		.container {
			background-color: #ffffff;
			padding: 2.5rem;
			border-radius: 12px;
			box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
			width: 100%;
			max-width: 420px;
			text-align: center;
		}

		h2 {
			font-size: 1.6rem;
			font-weight: 600;
			margin-bottom: 0.5rem;
			color: #1e293b;
		}

		form {
			display: flex;
			flex-direction: column;
			gap: 0.75rem;
			margin-top: 0.5rem;
		}

		input[type="text"], input[type="email"], input[type="search"] {
			padding: 0.85rem 0.9rem;
			border: 1px solid #cbd5e1;
			border-radius: 8px;
			font-size: 1rem;
			background: #f8fafc; /* subtle input background to improve contrast */
			color: #0f172a;
			min-height: 44px;
			outline: none;
			transition: box-shadow 0.12s ease, border-color 0.12s ease;
		}

		input::placeholder { color: #94a3b8; }

		input:focus {
			border-color: #2563eb;
			box-shadow: 0 6px 14px rgba(37,99,235,0.08);
		}

		.role-row {
			display: flex;
			gap: 0.75rem;
			justify-content: center;
			margin-top: 0.25rem;
		}

		.role-box {
			flex: 1;
			padding: 0.75rem;
			border: 1px solid #e5e7eb;
			border-radius: 10px;
			cursor: pointer;
			user-select: none;
			background: #ffffff;
			transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.07s ease;
		}

		.role-box.selected {
			border-color: #2563eb;
			box-shadow: 0 6px 18px rgba(37,99,235,0.12);
			transform: translateY(-2px);
		}

		button {
			width: 100%;
			padding: 0.85rem;
			border: none;
			border-radius: 8px;
			background-color: #2563eb;
			color: #ffffff;
			font-size: 1rem;
			cursor: pointer;
			transition: background-color 0.25s ease, transform 0.1s ease;
			margin-top: 0.25rem;
		}

		button:hover { background-color: #1d4ed8; }
		button:active { transform: scale(0.99); }

		#status {
			color: #4b5563;
			font-size: 0.95rem;
			margin-top: 0.75rem;
			min-height: 1.1rem;
		}

		.muted { color: #6b7280; font-size: 0.9rem; margin-bottom: 0.5rem; }

		footer {
			position: absolute;
			bottom: 15px;
			color: #6b7280;
			font-size: 0.85rem;
			text-align: center;
			width: 100%;
		}
	</style>
</head>
<body>
	<div class="container">
		<h2>Create your account</h2>
		<p class="muted">Already have an account? <a href="/index.html" style="color:#2563eb;">Sign in</a></p>

		<form id="signupForm">
			<input type="text" id="name" placeholder="Full Name (e.g. Jane Doe)" required />

			<input type="email" id="email" placeholder="Email (you@example.com)" required />

			<div class="role-row" role="radiogroup" aria-label="User type">
				<div class="role-box" id="roleVolunteer" data-role="volunteer">Volunteer</div>
				<div class="role-box" id="roleRequestor" data-role="elder">Elder / Requestor</div>
			</div>

			<input type="text" id="address" placeholder="Address (Street, City, State)" required />

			<button id="sendCodeBtn" type="submit">Send confirmation</button>
		</form>

		<div id="codeSection" style="display:none; margin-top:0.75rem;">
			<input type="text" id="codeInput" placeholder="Enter 6-digit code" maxlength="6" />
			<button id="verifyBtn" type="button">Verify code</button>
		</div>

		<div id="status"></div>
	</div>

	<footer>
		© 2025 UB Hackaton, All Rights Reserved.
	</footer>

	<script>
		const API_BASE = "http://localhost:8000";
		const EDU_REGEX = /@.+\.edu$/i;

		const signupForm = document.getElementById('signupForm');
		const roleVolunteer = document.getElementById('roleVolunteer');
		const roleRequestor = document.getElementById('roleRequestor');
		const status = document.getElementById('status');
		const codeSection = document.getElementById('codeSection');
		const codeInput = document.getElementById('codeInput');
		const verifyBtn = document.getElementById('verifyBtn');

		let selectedRole = null;
		let userEmail = "";
		let savedAddress = "";
		let savedContactMethod = "Email";

		function clearSelection() {
			roleVolunteer.classList.remove('selected');
			roleRequestor.classList.remove('selected');
		}

		roleVolunteer.addEventListener('click', () => {
			clearSelection();
			roleVolunteer.classList.add('selected');
			selectedRole = roleVolunteer.getAttribute('data-role');
		});

		roleRequestor.addEventListener('click', () => {
			clearSelection();
			roleRequestor.classList.add('selected');
			selectedRole = roleRequestor.getAttribute('data-role');
		});

		signupForm.addEventListener('submit', async (e) => {
			e.preventDefault();

			const name = document.getElementById('name').value.trim();
			const email = document.getElementById('email').value.trim();
			const address = document.getElementById('address').value.trim();
			const EDU_REGEX = /@.+\.edu$/i;

			if (!name || !email) {
				status.textContent = 'Please enter your name and email.';
				status.style.color = '#dc2626';
				return;
			}

			if (!EDU_REGEX.test(email)) {
				status.textContent = 'Email must end with .edu';
				status.style.color = '#dc2626';
				return;
			}

			if (!address) {
				status.textContent = 'Please enter your address.';
				status.style.color = '#dc2626';
				return;
			}

			if (!selectedRole) {
				status.textContent = 'Please select a user type.';
				status.style.color = '#dc2626';
				return;
			}

			savedAddress = address;
			savedContactMethod = 'Email';

			status.textContent = 'Requesting verification code...';
			status.style.color = '#4b5563';

			try {
				const response = await fetch(`${API_BASE}/auth/request-code`, {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({ email, role: selectedRole })
				});

				if (!response.ok) {
					const errorData = await response.json().catch(() => ({}));
					throw new Error(errorData.detail || 'Failed to send verification code.');
				}

				userEmail = email;
				status.textContent = 'Code sent! Check your email (or backend console) for the OTP.';
				status.style.color = '#16a34a';
				signupForm.style.display = 'none';
				codeSection.style.display = 'flex';
				codeSection.style.flexDirection = 'column';
				codeSection.style.gap = '0.6rem';
			} catch (err) {
				console.error('Error requesting signup OTP:', err);
				status.textContent = err.message || 'Network error while requesting code.';
				status.style.color = '#dc2626';
			}
		});

		verifyBtn.addEventListener('click', async () => {
			const entered = codeInput.value.trim();
			if (!entered || entered.length !== 6) {
				status.textContent = 'Enter the 6-digit code.';
				status.style.color = '#dc2626';
				return;
			}

			status.textContent = 'Verifying code...';
			status.style.color = '#4b5563';

			try {
				const response = await fetch(`${API_BASE}/auth/verify-code`, {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({ email: userEmail, code: entered })
				});

				const data = await response.json().catch(() => ({}));

				if (!response.ok) {
					throw new Error(data.detail || 'Verification failed. Please try again.');
				}

				localStorage.setItem('token', data.access_token);
				localStorage.setItem('user', JSON.stringify(data.user));

				if (selectedRole === 'elder' && savedAddress) {
					try {
						await fetch(`${API_BASE}/profile/elder`, {
							method: 'POST',
							headers: {
								'Content-Type': 'application/json',
								'Authorization': `Bearer ${data.access_token}`,
							},
							body: JSON.stringify({
								address: savedAddress,
								mobility_notes: '',
								preferred_contact_method: savedContactMethod,
							}),
						});
					} catch (profileError) {
						console.warn('Unable to create elder profile automatically:', profileError);
					}
				}

				status.textContent = `Email confirmed. Welcome, ${data.user.email}!`;
				status.style.color = '#16a34a';

				codeSection.style.display = 'none';
				const confirmed = document.createElement('div');
				confirmed.style.marginTop = '0.75rem';
				confirmed.textContent = 'Your email is confirmed — redirecting to your dashboard...';
				confirmed.style.color = '#065f46';
				document.querySelector('.container').appendChild(confirmed);

				setTimeout(() => {
					if (data.user.role === 'volunteer') {
						window.location.replace('/volunteer-view.html');
					} else if (data.user.role === 'elder') {
						window.location.replace('/submit-request.html');
					} else {
						window.location.replace('/guest-view.html');
					}
				}, 1000);
			} catch (err) {
				console.error('Error verifying signup OTP:', err);
				status.textContent = err.message || 'Network error while verifying code.';
				status.style.color = '#dc2626';
			}
		});
	</script>
</body>
</html>

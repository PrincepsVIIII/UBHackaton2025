<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Monopoly Clicker Demo</title>
    <style>
      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f2f2f2;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #222;
      }

      #board-wrapper {
        padding: 12px;
        background: #fff;
        border: 4px solid #222;
        border-radius: 14px;
        box-shadow: 0 12px 25px rgba(0, 0, 0, 0.1);
      }

      #board {
        display: grid;
        grid-template-columns: repeat(11, minmax(45px, 1fr));
        grid-template-rows: repeat(11, minmax(45px, 1fr));
        gap: 4px;
        width: min(92vmin, 640px);
        height: min(92vmin, 640px);
      }

      .tile {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 6px;
        border: 2px solid #a0a0a0;
        border-radius: 8px;
        background: linear-gradient(145deg, #fafafa, #e9e9e9);
        transition: transform 0.15s ease, border-color 0.15s ease;
        font-size: 0.75rem;
        line-height: 1.1;
      }

      .tile.corner {
        font-weight: 600;
        background: linear-gradient(145deg, #fff3cd, #ffe9a6);
        border-color: #d39e00;
      }

      .tile:hover {
        transform: translateY(-2px);
        border-color: #222;
      }

      .tile .index {
        position: absolute;
        top: 6px;
        right: 8px;
        font-size: 0.65rem;
        color: #555;
      }

      .tile .label {
        margin-top: 12px;
        font-size: 0.8rem;
        color: #333;
      }

      #center-clicker {
        grid-row: 2 / span 9;
        grid-column: 2 / span 9;
        border: 3px solid #2e7d32;
        border-radius: 18px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: clamp(1.1rem, 3vw, 1.8rem);
        font-weight: 600;
        color: #1b5e20;
        background: linear-gradient(145deg, #c8f7c5, #9be29b);
        box-shadow: inset 0 -4px 12px rgba(46, 125, 50, 0.35),
          0 6px 18px rgba(27, 94, 32, 0.25);
        transition: transform 0.08s ease, box-shadow 0.2s ease;
      }

      #center-clicker:hover {
        box-shadow: inset 0 -2px 8px rgba(46, 125, 50, 0.25),
          0 8px 22px rgba(27, 94, 32, 0.3);
      }

      #center-clicker:active {
        transform: scale(0.97);
        box-shadow: inset 0 -1px 4px rgba(46, 125, 50, 0.2),
          0 4px 12px rgba(27, 94, 32, 0.2);
      }

      #board-note {
        margin-top: 16px;
        text-align: center;
        font-size: 0.85rem;
        color: #555;
      }
    </style>
  </head>
  <body>
    <main id="board-wrapper">
      <section id="board" aria-label="Monopoly board"></section>
      <p id="board-note">Click the bank in the middle to earn money!</p>
    </main>

    <script>
      (function () {
        const board = document.getElementById("board");
        const cornerLabels = {
          0: "Go",
          10: "Jail",
          20: "Free Parking",
          30: "Go To Jail",
        };

        function getCoordsForPos(pos) {
          if (pos >= 0 && pos <= 10) {
            return { row: 11, col: 11 - pos };
          }
          if (pos >= 11 && pos <= 20) {
            return { row: 11 - (pos - 10), col: 1 };
          }
          if (pos >= 21 && pos <= 30) {
            return { row: 1, col: pos - 20 + 1 };
          }
          return { row: pos - 30 + 1, col: 11 };
        }

        function createTile(pos) {
          const tile = document.createElement("div");
          tile.classList.add("tile");
          tile.dataset.pos = String(pos);

          if (cornerLabels[pos]) {
            tile.classList.add("corner");
          }

          const { row, col } = getCoordsForPos(pos);
          tile.style.gridRow = String(row);
          tile.style.gridColumn = String(col);

          const indexBadge = document.createElement("span");
          indexBadge.className = "index";
          indexBadge.textContent = pos;
          tile.appendChild(indexBadge);

          const label = document.createElement("div");
          label.className = "label";
          label.textContent = cornerLabels[pos] || `Square ${pos}`;
          tile.appendChild(label);

          return tile;
        }

        for (let pos = 0; pos < 40; pos += 1) {
          board.appendChild(createTile(pos));
        }

        const centerButton = document.createElement("button");
        centerButton.id = "center-clicker";
        centerButton.type = "button";
        board.appendChild(centerButton);

        let money = 0;

        function renderMoney() {
          centerButton.textContent = `Bank: $${money}`;
        }

        centerButton.addEventListener("click", () => {
          money += 1;
          renderMoney();
        });

        renderMoney();
      })();
    </script>
  </body>
</html>
